<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База продуктов | Fitness Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #ffffff; color: #1d1d1f; overflow-x: hidden; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: saturate(180%) blur(20px); }
        .search-input { transition: all 0.3s ease; background: #f5f5f7; border: 1px solid transparent; }
        .search-input:focus { background: #ffffff; border-color: #0071e3; outline: none; box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1); }
        .food-card { border-radius: 2.2rem; border: 1px solid #f2f2f7; background: #ffffff; transition: all 0.3s ease; }
        .food-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.04); border-color: #0071e3; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .animate__fadeOut { animation: fadeOut 0.8s forwards; }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body class="pt-20 sm:pt-24 text-left">

<nav class="glass-nav fixed top-0 w-full z-50 h-16 flex items-center px-4 sm:px-10 border-b border-gray-100/50">
    <div class="w-1/2 lg:w-1/4 flex items-center gap-2 sm:gap-4">
        <a href="javascript:void(0)" onclick="goHome()" class="font-extrabold text-lg sm:text-xl tracking-tighter hover:opacity-70 transition text-black shrink-0">
            Fitness<span class="text-blue-600">Assistant</span>
        </a>
        <div class="h-4 w-px bg-gray-200 mx-1 sm:mx-2 shrink-0"></div>
        <span class="text-xs sm:text-sm font-semibold text-gray-500 tracking-tight whitespace-nowrap">База продуктов</span>
    </div>
    <div class="hidden lg:flex flex-1 justify-center overflow-hidden px-4">
        <p id="motivation-text" class="animate__animated animate__fadeIn text-[10px] font-black uppercase tracking-[0.4em] text-black whitespace-nowrap">
            Еда — это топливо, а не награда
        </p>
    </div>
    <div class="hidden lg:flex w-1/4 justify-end">
        <span class="text-[9px] font-black text-gray-300 uppercase tracking-widest">ПОИСК КБЖУ ПРОДУКТОВ</span>
    </div>
</nav>

<main class="max-w-6xl mx-auto px-4 sm:px-6">
    <header class="mb-8 sm:mb-12 animate__animated animate__fadeIn">
        <h1 class="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tighter mb-3 sm:mb-4 text-gray-900">Что сегодня в меню?</h1>
        <p class="text-gray-400 text-base sm:text-lg font-medium">Исследуй базу данных для построения идеального питания.</p>
    </header>

    <section class="mb-10 sm:mb-14 animate__animated animate__fadeIn">
        <div class="relative">
            <input type="text" id="foodSearch" placeholder="Введите название продукта..."
                   class="search-input w-full p-4 sm:p-6 pl-12 sm:pl-14 rounded-2xl sm:rounded-3xl text-base sm:text-xl font-medium" autocomplete="off">
            <div class="absolute left-4 sm:left-6 top-1/2 -translate-y-1/2 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
        </div>
    </section>

    <!-- Состояние по умолчанию — подсказка -->
    <div id="emptyState" class="py-24 sm:py-32 text-center animate__animated animate__fadeIn">
        <p class="text-gray-400 text-sm font-bold uppercase tracking-[0.2em]">Введите название продукта выше, чтобы начать поиск</p>
    </div>

    <!-- Грид карточек -->
    <section id="foodGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 lg:gap-8 pb-6 hidden"></section>

    <!-- Пагинация -->
    <div id="paginationControls" class="hidden flex justify-center items-center gap-4 sm:gap-6 py-10 sm:pb-20">
        <button id="prevBtn" class="page-btn px-5 sm:px-8 py-3 sm:py-4 bg-gray-100 rounded-xl sm:rounded-2xl font-bold text-sm sm:text-base hover:bg-gray-200 transition">← Назад</button>
        <span class="font-black text-lg sm:text-xl text-gray-900" id="currentPageDisplay">1</span>
        <button id="nextBtn" class="page-btn px-5 sm:px-8 py-3 sm:py-4 bg-gray-100 rounded-xl sm:rounded-2xl font-bold text-sm sm:text-base hover:bg-gray-200 transition">Вперед →</button>
    </div>
</main>

<script>
    function goHome() {
        try {
            const token = localStorage.getItem('token');
            if (token) {
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (payload.exp * 1000 > Date.now()) { window.location.href = '/dashboard'; return; }
            }
        } catch (e) {}
        window.location.href = '/';
    }

    const phrases = ["Еда — это топливо, а не награда","Ты — то, что ты ешь","Заботься о своем теле, это единственное место, где тебе жить","Пресс делается на кухне","Каждый прием пищи — это выбор в пользу здоровья"];
    let phraseIdx = 0;
    const textEl = document.getElementById('motivation-text');
    function startMotivation() {
        setInterval(() => {
            textEl.classList.remove('animate__fadeIn');
            textEl.classList.add('animate__fadeOut');
            setTimeout(() => {
                phraseIdx = (phraseIdx + 1) % phrases.length;
                textEl.innerText = phrases[phraseIdx];
                textEl.classList.remove('animate__fadeOut');
                textEl.classList.add('animate__fadeIn');
            }, 800);
        }, 5000);
    }

    let currentPage = 0;
    const pageSize = 9;
    let searchTimeout = null;
    let lastQuery = '';

    async function loadFood(page = 0, query = '') {
    if (!query || query.trim().length === 0) {
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('foodGrid').classList.add('hidden');
        document.getElementById('paginationControls').classList.add('hidden');
        return;
    }

    try {
        const url = `/api/v1/food?name=${encodeURIComponent(query)}&page=${page}&size=${pageSize}`;
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error('Ошибка сервера');
        }

        const data = await response.json();

        if (!data.content || data.content.length === 0) {
            renderNotFound(query);        // показываем "ничего не найдено"
            return;
        }

        renderGrid(data.content, query);
        updatePagination(data);

    } catch (e) {
        console.error('Ошибка загрузки:', e);
        renderNotFound(query);
    }
}

    function renderGrid(foods, query) {
        const grid = document.getElementById('foodGrid');
        const emptyState = document.getElementById('emptyState');

        if (!foods || foods.length === 0) {
            renderNotFound(query);
            return;
        }

        emptyState.classList.add('hidden');
        grid.classList.remove('hidden');

        grid.innerHTML = foods.map(food => `
            <div class="food-card p-5 sm:p-8 flex flex-col justify-between group animate__animated animate__fadeIn">
                <div class="mb-4 text-center">
                    <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-widest inline-block mb-3">
                        ${food.brands || 'Без бренда'}
                    </span>
                    <h3 class="font-bold text-xl sm:text-2xl text-gray-900 leading-tight">${food.name}</h3>
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-3">на 100г продукта</p>
                </div>
                <div class="grid grid-cols-2 gap-2 sm:gap-3 w-full mt-2 text-left">
                    <div class="bg-gray-50 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-gray-100">
                        <p class="text-[9px] font-black text-gray-400 uppercase mb-1">Калории</p>
                        <p class="text-lg sm:text-xl font-bold text-gray-900">${food.kcal} <span class="text-xs font-medium text-gray-400">ккал</span></p>
                    </div>
                    <div class="bg-blue-50/30 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-blue-50">
                        <p class="text-[9px] font-black text-blue-500 uppercase mb-1">Белки</p>
                        <p class="text-lg sm:text-xl font-bold text-blue-600">${food.proteins}</p>
                    </div>
                    <div class="bg-red-50/30 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-red-50">
                        <p class="text-[9px] font-black text-red-500 uppercase mb-1">Жиры</p>
                        <p class="text-lg sm:text-xl font-bold text-red-600">${food.fats}</p>
                    </div>
                    <div class="bg-green-50/30 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-green-50">
                        <p class="text-[9px] font-black text-green-500 uppercase mb-1">Углеводы</p>
                        <p class="text-lg sm:text-xl font-bold text-green-600">${food.carbs}</p>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderNotFound(query) {
        const grid = document.getElementById('foodGrid');
        const emptyState = document.getElementById('emptyState');

        emptyState.classList.add('hidden');
        document.getElementById('paginationControls').classList.add('hidden');
        grid.classList.remove('hidden');
        grid.innerHTML = `
            <div class="col-span-full py-16 sm:py-20 text-center animate__animated animate__fadeIn">
                <div class="text-5xl sm:text-6xl mb-4">🔍</div>
                <p class="text-gray-400 text-lg sm:text-xl font-bold uppercase tracking-tight">
                    Продукт <span class="text-blue-600">«${query}»</span> не найден
                </p>
                <button onclick="document.getElementById('foodSearch').value=''; loadFood()"
                        class="text-blue-600 font-extrabold mt-6 inline-block hover:opacity-70 transition text-sm uppercase tracking-widest">
                    Очистить поиск
                </button>
            </div>`;
    }

    function updatePagination(data) {
        currentPage = data.number;
        const controls = document.getElementById('paginationControls');
        controls.classList.remove('hidden');
        document.getElementById('currentPageDisplay').innerText = currentPage + 1;
        document.getElementById('prevBtn').disabled = data.first;
        document.getElementById('nextBtn').disabled = data.last;
    }

    // Debounce — ждём 400мс после последнего символа как в упражнениях
    document.getElementById('foodSearch').oninput = (e) => {
        clearTimeout(searchTimeout);
        const query = e.target.value.trim();
        searchTimeout = setTimeout(() => {
            lastQuery = query;
            currentPage = 0;
            loadFood(0, query);
        }, 400);
    };

    document.getElementById('prevBtn').onclick = () => loadFood(currentPage - 1, lastQuery);
    document.getElementById('nextBtn').onclick = () => loadFood(currentPage + 1, lastQuery);

    window.onload = () => startMotivation();
</script>
</body>
</html>
