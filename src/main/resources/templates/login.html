<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Fitness Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #ffffff; color: #1d1d1f; overflow-x: hidden; }
        .hero-title { font-family: 'Manrope', sans-serif; letter-spacing: -0.04em; line-height: 0.9; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: saturate(180%) blur(20px); }
        .input-field { transition: all 0.3s ease; background: #f5f5f7; border: 1px solid transparent; border-radius: 1rem; }
        .input-field:focus { background: #ffffff; border-color: #0071e3; outline: none; box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1); }
        .auth-card { border-radius: 2.2rem; border: 1px solid #f2f2f7; background: rgba(245, 245, 247, 0.4); }
        .btn-apple { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 1.25rem; }
        .btn-apple:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .btn-apple:active { transform: scale(0.97); }
        .btn-apple:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-box { border-radius: 1rem; background: #fff2f2; border: 1px solid #ffdddd; }
    </style>
</head>
<body>

<nav class="glass-nav fixed top-0 w-full z-50 h-16 flex items-center px-4 sm:px-10 border-b border-gray-100/50">
    <div class="w-1/2 sm:w-1/4">
        <a href="javascript:void(0)" onclick="goHome()" class="font-extrabold text-xl tracking-tighter">
            Fitness<span class="text-blue-600">Assistant</span>
        </a>
    </div>
    <div class="hidden sm:flex w-2/4 justify-center">
        <p class="text-[10px] font-black uppercase tracking-[0.4em] text-black whitespace-nowrap">Продолжи свой путь</p>
    </div>
    <div class="w-1/2 sm:w-1/4 flex justify-end">
        <a href="/register" class="text-sm font-bold text-blue-600 hover:opacity-70 transition">Регистрация →</a>
    </div>
</nav>

<main class="pt-24 sm:pt-32 pb-20 flex flex-col items-center text-center px-4 sm:px-6">

    <div class="animate__animated animate__fadeInDown mb-3">
        <span class="text-[9px] font-black text-gray-300 uppercase tracking-[0.5em]">С возвращением</span>
    </div>

    <h1 class="animate__animated animate__fadeInDown hero-title text-5xl sm:text-7xl font-extrabold mb-4 tracking-tighter">Вход</h1>

    <p class="animate__animated animate__fadeInUp text-lg sm:text-xl font-bold text-gray-700 mb-10 tracking-tight">
        Введи свои данные чтобы продолжить
    </p>

    <div class="animate__animated animate__fadeIn animate__delay-1s auth-card w-full max-w-md p-6 sm:p-10 text-left">

        <div id="error-box" class="error-box hidden px-5 py-4 mb-6">
            <p id="error-text" class="text-red-600 text-sm font-bold"></p>
        </div>

        <div class="mb-5">
            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 block">Email</label>
            <input type="email" id="email" placeholder="you@example.com"
                   class="input-field w-full px-5 py-4 text-base font-medium">
        </div>

        <div class="mb-8">
            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 block">Пароль</label>
            <input type="password" id="password" placeholder="••••••••"
                   class="input-field w-full px-5 py-4 text-base font-medium">
        </div>

        <button id="login-btn" onclick="handleLogin()"
                class="btn-apple bg-blue-600 text-white text-base font-bold px-8 py-5 w-full shadow-2xl shadow-blue-100">
            Войти
        </button>

        <div class="mt-6 text-center">
            <span class="text-sm text-gray-400 font-medium">Нет аккаунта? </span>
            <a href="/register" class="text-sm font-bold text-blue-600 hover:opacity-70 transition">Зарегистрироваться</a>
        </div>
    </div>
</main>

<script>
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

    async function handleLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('login-btn');

        document.getElementById('error-box').classList.add('hidden');

        if (!email || !password) { showError('Заполни все поля'); return; }

        btn.disabled = true;
        btn.textContent = 'Входим...';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (!res.ok) { showError(data.error || 'Ошибка входа'); return; }

            localStorage.setItem('token', data.token);
            localStorage.setItem('email', data.email);
            localStorage.setItem('role', data.role);

            // Раньше редирект шёл на '/', потом JS на index.html
            // делал ещё один редирект на /dashboard — два прыжка вместо одного.
            window.location.href = '/dashboard';

        } catch (e) {
            showError('Сервер недоступен');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Войти';
        }
    }

    function goHome() {
        try {
            const token = localStorage.getItem('token');
            if (token) {
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (payload.exp * 1000 > Date.now()) { window.location.href = '/dashboard'; return; }
            }
        } catch (e) {}
        window.location.href = '/';
    }

    function showError(msg) {
        document.getElementById('error-text').textContent = msg;
        document.getElementById('error-box').classList.remove('hidden');
    }

    window.onload = () => {
        try {
            const token = localStorage.getItem('token');
            if (token) {
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (payload.exp * 1000 > Date.now()) { window.location.href = '/dashboard'; }
            }
        } catch (e) {}
    };
</script>
</body>
</html>
