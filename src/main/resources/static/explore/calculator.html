<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор КБЖУ — Fitness Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="font-['Inter'] bg-gray-50 min-h-screen">
<nav class="bg-white border-b border-gray-100 h-16 px-4 md:px-10 flex items-center justify-between">
    <a id="logoLink" href="/index.html" class="font-extrabold text-xl tracking-tighter">Fitness<span class="text-blue-600">Assistant</span></a>
    <div class="flex gap-4 items-center">
        <a href="/login.html" class="text-sm font-semibold text-gray-600 hover:text-black">Вход</a>
        <a href="/register.html" class="text-sm font-semibold bg-blue-600 text-white px-5 py-2 rounded-full hover:bg-blue-700">Регистрация</a>
    </div>
</nav>
<div id="activeSessionBanner" class="hidden bg-yellow-50 border-b border-yellow-200 px-4 md:px-10 py-2 text-sm flex items-center justify-between" style="position:sticky;top:64px;z-index:40">
    <span>⏳ <strong>Активная тренировка</strong> — <span id="bannerName"></span></span>
    <a id="bannerLink" href="" class="bg-yellow-200 text-yellow-800 px-4 py-1 rounded-lg font-semibold hover:bg-yellow-300">Продолжить</a>
</div>
<div class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">🧮 Калькулятор КБЖУ</h1>
    <div class="flex gap-3 mb-6">
        <input id="searchInput" placeholder="Поиск продуктов..." class="flex-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
        <button onclick="search()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700">Найти</button>
    </div>
    <div id="results" class="space-y-3"></div>
    <div id="pagination" class="flex justify-center items-center gap-2 mt-6"></div>
</div>
<script src="/js/api.js"></script>
<script>
    if (isAuth()) document.getElementById('logoLink').href = '/dashboard.html';

    let currentPage = 0;
    let totalPages = 0;
    let expandedFoodId = null;

    async function search(page = 0) {
        currentPage = page;
        const q = document.getElementById('searchInput').value;
        const endpoint = q ? `/food/search?name=${encodeURIComponent(q)}&page=${page}&size=9` : `/food?page=${page}&size=9`;
        const data = await request(endpoint);
        totalPages = data.totalPages;
        expandedFoodId = null;
        document.getElementById('results').innerHTML = data.content.map(f => `
            <div class="bg-white rounded-2xl p-5 border border-gray-100 hover:shadow-lg transition-shadow cursor-pointer" onclick="toggleDetail(${f.id})">
                <div class="flex items-start justify-between">
                    <div>
                        <h3 class="font-bold text-lg">${f.name}</h3>
                        <p class="text-sm text-gray-400">${f.brands || 'Нет бренда'}</p>
                    </div>
                    <span class="text-gray-300 text-sm mt-1.5" id="arrow_${f.id}">▼</span>
                </div>
                <div class="flex items-center gap-1 mt-3 mb-1">
                    <span class="text-xs text-gray-400 font-medium">Пищевая ценность на 100 г</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 text-center">
                    <div><span class="font-bold text-blue-600 text-lg">${f.kcal.toFixed(1)}</span><br><span class="text-gray-400 text-sm">ккал</span></div>
                    <div><span class="font-bold text-lg">${f.proteins.toFixed(1)}</span><br><span class="text-gray-400 text-sm">белки</span></div>
                    <div><span class="font-bold text-lg">${f.fats.toFixed(1)}</span><br><span class="text-gray-400 text-sm">жиры</span></div>
                    <div><span class="font-bold text-lg">${f.carbs.toFixed(1)}</span><br><span class="text-gray-400 text-sm">углеводы</span></div>
                </div>
                <div id="detail_${f.id}" class="hidden mt-3 pt-3 border-t border-gray-200" onclick="event.stopPropagation()">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-sm text-gray-500">Вес (г):</span>
                        <input id="calcWeight_${f.id}" type="number" placeholder="100" class="w-24 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500" onclick="event.stopPropagation()">
                        <button onclick="event.stopPropagation(); calculate(${f.id})" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">🧮 Рассчитать</button>
                    </div>
                    <div id="calcResult_${f.id}" class="hidden">
                        <div class="flex items-center gap-1 mb-1">
                            <span class="text-xs text-gray-400 font-medium">Ценность на <span id="calcWeightLabel_${f.id}"></span> г</span>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 text-center">
                            <div><span class="font-bold text-blue-600 text-lg" id="calcKcal_${f.id}"></span><br><span class="text-gray-400 text-sm">ккал</span></div>
                            <div><span class="font-bold text-lg" id="calcProteins_${f.id}"></span><br><span class="text-gray-400 text-sm">белки</span></div>
                            <div><span class="font-bold text-lg" id="calcFats_${f.id}"></span><br><span class="text-gray-400 text-sm">жиры</span></div>
                            <div><span class="font-bold text-lg" id="calcCarbs_${f.id}"></span><br><span class="text-gray-400 text-sm">углеводы</span></div>
                        </div>
                        <div id="calcSave_${f.id}" class="mt-3"></div>
                    </div>
                </div>
            </div>
        `).join('');
        renderPagination();
    }

    function toggleDetail(id) {
        const detail = document.getElementById(`detail_${id}`);
        const arrow = document.getElementById(`arrow_${id}`);
        if (!detail) return;
        const isOpen = !detail.classList.contains('hidden');
        if (expandedFoodId && expandedFoodId !== id) {
            const prevDetail = document.getElementById(`detail_${expandedFoodId}`);
            const prevArrow = document.getElementById(`arrow_${expandedFoodId}`);
            if (prevDetail) prevDetail.classList.add('hidden');
            if (prevArrow) prevArrow.textContent = '▼';
        }
        detail.classList.toggle('hidden');
        arrow.textContent = isOpen ? '▼' : '▲';
        expandedFoodId = isOpen ? null : id;
    }

    async function calculate(id) {
        const weight = parseFloat(document.getElementById(`calcWeight_${id}`).value);
        if (!weight || weight <= 0) return;
        const data = await request(`/food/calc/${id}?weight=${weight}`);
        document.getElementById(`calcWeightLabel_${id}`).textContent = weight;
        document.getElementById(`calcKcal_${id}`).textContent = data.kcal.toFixed(1);
        document.getElementById(`calcProteins_${id}`).textContent = data.proteins.toFixed(1);
        document.getElementById(`calcFats_${id}`).textContent = data.fats.toFixed(1);
        document.getElementById(`calcCarbs_${id}`).textContent = data.carbs.toFixed(1);
        document.getElementById(`calcResult_${id}`).classList.remove('hidden');

        const saveBlock = document.getElementById(`calcSave_${id}`);
        if (isAuth()) {
            saveBlock.innerHTML = `<button onclick="event.stopPropagation(); saveMeal(${id}, ${weight})" class="bg-green-600 text-white px-6 py-2.5 rounded-lg text-sm font-bold hover:bg-green-700 w-full">💾 Сохранить приём пищи</button>`;
        } else {
            saveBlock.innerHTML = `<a href="/login.html" class="block text-center bg-gray-100 text-gray-500 px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-gray-200">Войдите, чтобы сохранить</a>`;
        }
    }

    async function saveMeal(foodId, weight) {
        try {
            await request('/meal/auto', {
                method: 'POST',
                body: JSON.stringify({ id: foodId, weight, name: 'auto', consumedAt: new Date().toISOString() })
            });
            const arrow = document.getElementById(`arrow_${foodId}`);
            if (arrow) arrow.textContent = '✅';
            setTimeout(() => { if (arrow) arrow.textContent = '▼'; }, 2000);
        } catch (e) {}
    }

    function renderPagination() {
        const el = document.getElementById('pagination');
        if (totalPages <= 1) { el.innerHTML = ''; return; }
        let html = '';
        html += `<button onclick="search(${currentPage - 1})" class="px-3 py-1 rounded-lg border ${currentPage === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-gray-100'}">← Назад</button>`;
        for (let i = Math.max(0, currentPage - 2); i < Math.min(totalPages, currentPage + 3); i++) {
            html += `<button onclick="search(${i})" class="px-3 py-1 rounded-lg ${i === currentPage ? 'bg-blue-600 text-white' : 'border hover:bg-gray-100'}">${i + 1}</button>`;
        }
        html += `<button onclick="search(${currentPage + 1})" class="px-3 py-1 rounded-lg border ${currentPage >= totalPages - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-gray-100'}">Вперёд →</button>`;
        el.innerHTML = html;
    }
    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') search(); if (isAuth()) { renderActiveSessionBanner(); syncActiveSessions(); } });
    search(); renderActiveSessionBanner(); if (isAuth()) syncActiveSessions();
</script>
</body>
</html>
