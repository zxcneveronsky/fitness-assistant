<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вода — Fitness Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .donut-wrap { position: relative; }
        .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: saturate(180%) blur(20px); }
    </style>
</head>
<body class="font-['Inter'] bg-gray-50 min-h-screen">
    <nav class="glass-nav fixed top-0 w-full z-50 h-16 flex items-center px-4 md:px-10 border-b border-gray-100/50">
        <a id="logoLink" href="/index.html" class="font-extrabold text-xl tracking-tighter">Fitness<span class="text-blue-600">Assistant</span></a>
        <div class="hidden md:flex gap-3 items-center text-sm">
            <a href="/dashboard.html" class="text-gray-600 hover:text-black">Главная</a>
            <a href="/meal.html" class="text-gray-600 hover:text-black">Еда</a>
            <a href="/hydration.html" class="font-semibold text-blue-600">Вода</a>
            <a href="/workout.html" class="text-gray-600 hover:text-black">Тренировки</a>
            <a href="/history.html" class="text-gray-600 hover:text-black">История</a>
            <a href="/profile.html" class="text-gray-600 hover:text-black">Профиль</a>
            <span id="adminNavLink" class="hidden"><a href="/admin.html" class="text-purple-600 hover:text-purple-800 font-semibold">Админка</a></span>
            <button onclick="logout()" class="text-red-500 hover:text-red-700 ml-4">Выйти</button>
            <button onclick="deleteAccount()" class="text-gray-400 hover:text-red-600 ml-2 text-sm" title="Удалить аккаунт">🗑️</button>
    </div>
    <button onclick="document.getElementById('mobileMenu').classList.toggle('hidden')" class="md:hidden text-gray-600 text-2xl px-2">☰</button>
</nav>
<div id="mobileMenu" class="hidden md:hidden bg-white border-b border-gray-100 px-4 py-3 space-y-2 text-sm">
    <a href="/dashboard.html" class="block text-gray-600 hover:text-black">Главная</a>
    <a href="/meal.html" class="block text-gray-600 hover:text-black">Еда</a>
    <a href="/hydration.html" class="block text-blue-600 font-semibold">Вода</a>
    <a href="/workout.html" class="block text-gray-600 hover:text-black">Тренировки</a>
    <a href="/history.html" class="block text-gray-600 hover:text-black">История</a>
    <a href="/profile.html" class="block text-gray-600 hover:text-black">Профиль</a>
    <hr class="border-gray-100">
    <span id="mobileAdminNavLink" class="hidden"><a href="/admin.html" class="block text-purple-600 font-semibold">Админка</a></span>
    <button onclick="logout()" class="block text-red-500 hover:text-red-700 w-full text-left">Выйти</button>
    <button onclick="deleteAccount()" class="block text-gray-400 hover:text-red-600 w-full text-left text-xs">Удалить аккаунт</button>
</div>
    <div id="activeSessionBanner" class="hidden bg-yellow-50 border-b border-yellow-200 px-4 md:px-10 py-2 text-sm flex items-center justify-between" style="position:sticky;top:64px;z-index:40">
        <span>⏳ <strong>Активная тренировка</strong> — <span id="bannerName"></span></span>
        <a id="bannerLink" href="" class="bg-yellow-200 text-yellow-800 px-4 py-1 rounded-lg font-semibold hover:bg-yellow-300">Продолжить</a>
    </div>
    <main class="max-w-6xl mx-auto px-4 pt-24 pb-8">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold">💧 Трекер воды</h1>
            <input type="date" id="waterDate" onchange="loadWater()" class="px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm">
        </div>

        <div class="bg-white rounded-2xl p-4 md:p-6 border border-gray-100 mb-6 flex items-center gap-4 sm:gap-8">
        <div class="donut-wrap w-28 sm:w-36 h-28 sm:h-36 shrink-0">
            <canvas id="waterChart"></canvas>
            <div class="donut-center">
                <p id="water-pct" class="text-xl sm:text-2xl font-black text-gray-900">0%</p>
                <p class="text-[10px] text-gray-400 font-bold">из <span id="water-norm">0</span> мл</p>
            </div>
        </div>
        <div>
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Вода сегодня</p>
            <p class="text-2xl font-black text-gray-900 mt-1"><span id="water-current">0</span> <span class="text-sm text-gray-400 font-medium">мл</span></p>
                <div class="flex gap-2 mt-3">
                    <button onclick="quickAddWater(150)" class="text-[10px] font-black bg-blue-50 text-blue-600 py-2 px-3 rounded-xl hover:bg-blue-100">+150</button>
                    <button onclick="quickAddWater(250)" class="text-[10px] font-black bg-blue-50 text-blue-600 py-2 px-3 rounded-xl hover:bg-blue-100">+250</button>
                    <button onclick="quickAddWater(500)" class="text-[10px] font-black bg-blue-50 text-blue-600 py-2 px-3 rounded-xl hover:bg-blue-100">+500</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 border border-gray-100 mb-6">
            <h2 class="font-bold text-lg mb-4">Добавить запись</h2>
            <div class="flex gap-2 sm:gap-3 items-end">
                <div class="flex-1">
                    <label class="text-sm text-gray-500">Название</label>
                    <input id="waterName" type="text" value="Вода" class="w-full mt-1 px-3 sm:px-4 py-1.5 sm:py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div class="w-24 sm:w-32">
                    <label class="text-sm text-gray-500">Объём (л)</label>
                    <input id="waterAmount" type="number" step="0.1" value="0.25" class="w-full mt-1 px-3 sm:px-4 py-1.5 sm:py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <button onclick="addWater()" class="bg-blue-600 text-white px-4 sm:px-6 py-1.5 sm:py-2.5 rounded-xl font-semibold text-sm sm:text-base hover:bg-blue-700">+ Добавить</button>
            </div>
            <p id="waterError" class="text-red-500 text-sm mt-2 hidden"></p>
        </div>
        <div id="waterList" class="space-y-3"></div>
    </main>
    <script src="/js/api.js"></script>
    <script>
    if (!isAuth()) window.location.href = '/login.html';
    if (isAuth()) document.getElementById('logoLink').href = '/dashboard.html';
    if (isAdmin()) {
        document.getElementById('adminNavLink').classList.remove('hidden');
        document.getElementById('mobileAdminNavLink').classList.remove('hidden');
    }


        let waterChartObj = null;
        let waterNorm = 2000;
        let waterToday = 0;

        function initWaterChart() {
            const ctx = document.getElementById('waterChart');
            if (!ctx) return;
            waterChartObj = new Chart(ctx.getContext('2d'), {
                type: 'doughnut',
                data: { datasets: [{ data: [0, 100], backgroundColor: ['#0071e3', '#f0f7ff'], borderWidth: 0, cutout: '75%' }] },
                options: { plugins: { legend: { display: false }, tooltip: { enabled: false } }, animation: { duration: 600 } }
            });
        }

        function updateWaterChart() {
            if (!waterChartObj) return;
            const pct = waterNorm > 0 ? Math.min(Math.round((waterToday / waterNorm) * 100), 100) : 0;
            document.getElementById('water-pct').textContent = pct + '%';
            document.getElementById('water-current').textContent = waterToday.toFixed(0);
            document.getElementById('water-norm').textContent = waterNorm.toFixed(0);
            waterChartObj.data.datasets[0].data = [waterToday, Math.max(waterNorm - waterToday, 0)];
            waterChartObj.update();
        }

        async function loadWaterData() {
            try {
                const targets = await request('/profile/targets');
                if (targets) waterNorm = (targets.targetHydration || 2) * 1000;
        } catch (e) { console.error('loadWaterData targets error:', e); }

        try {
            const data = await request(`/hydration/daily?localDateTime=${encodeURIComponent(selectedWaterDate())}`);
            if (data) {
                waterToday = (data.totalAmount || 0) * 1000;
            }
        } catch (e) { console.error('loadWaterData hydration error:', e); }
            updateWaterChart();
        }

        function selectedWaterDate() {
            const d = document.getElementById('waterDate').value;
            return d ? new Date(d).toISOString() : new Date().toISOString();
        }

        async function addWater() {
            const name = document.getElementById('waterName').value || 'Вода';
            const amount = safeFloat(document.getElementById('waterAmount').value);
            if (!amount || amount <= 0) { showError('Укажите объём'); return; }
            try {
                await request('/hydration', { method: 'POST', body: JSON.stringify({ name, amount, consumedAt: selectedWaterDate() }) });
                document.getElementById('waterName').value = 'Вода';
                document.getElementById('waterAmount').value = '0.25';
                loadWater();
            } catch (e) { showError(e.message); }
        }

        async function quickAddWater(ml) {
            try {
                await request('/hydration', { method: 'POST', body: JSON.stringify({ name: 'Вода', amount: ml / 1000, consumedAt: selectedWaterDate() }) });
                waterToday += ml;
                updateWaterChart();
                loadWater();
            } catch (e) { showError(e.message); }
        }

        function showError(msg) {
            const el = document.getElementById('waterError');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        async function loadWater() {
            await loadWaterData();
            const waterData = await request(`/hydration/search?localDateTime=${encodeURIComponent(selectedWaterDate())}&size=50`);
            const waters = waterData.content || [];
            document.getElementById('waterList').innerHTML = waters.length === 0
                ? '<p class="text-gray-400 text-center py-8">Сегодня ещё не пили воду</p>'
                : waters.map(w => `
                    <div class="bg-white rounded-xl p-4 border border-gray-100 flex items-center justify-between" id="waterRow_${w.id}">
                        <div class="flex-1">
                            <span id="wView_${w.id}"><span class="font-semibold">${w.name}</span> <span class="text-blue-600 font-bold ml-2">${w.amount.toFixed(2)} л</span></span>
                            <div id="wEdit_${w.id}" class="hidden items-center gap-2">
                                <input id="wName_${w.id}" value="${w.name.replace(/'/g, "\\'")}" class="w-28 px-2 py-1 border border-gray-200 rounded-lg text-sm">
                                <input id="wAmt_${w.id}" type="number" step="0.1" value="${w.amount}" class="w-20 px-2 py-1 border border-gray-200 rounded-lg text-sm">
                                <span class="text-sm text-gray-400">л</span>
                                <button onclick="saveWaterEdit(${w.id})" class="text-green-600 hover:text-green-800 text-sm">💾</button>
                            </div>
                        </div>
                        <div class="flex gap-1 items-center shrink-0 ml-2">
                            <button onclick="toggleWaterEdit(${w.id})" class="text-blue-500 hover:text-blue-700 text-xs px-1">✏️</button>
                            <button onclick="deleteWater(${w.id})" class="text-red-400 hover:text-red-600 text-sm font-bold">✕</button>
                        </div>
                    </div>
                `).join('');
        }

        function toggleWaterEdit(id) {
            document.getElementById(`wView_${id}`).classList.toggle('hidden');
            const edit = document.getElementById(`wEdit_${id}`);
            edit.classList.toggle('hidden');
            edit.classList.toggle('flex');
        }

        async function saveWaterEdit(id) {
            const name = document.getElementById(`wName_${id}`).value.trim();
            const amount = safeFloat(document.getElementById(`wAmt_${id}`).value);
            if (!name || isNaN(amount) || amount <= 0) return;
            try {
                await request('/hydration', {
                    method: 'PATCH',
                    body: JSON.stringify({ id, name, amount })
                });
                loadWater();
            } catch (e) { showError(e.message); }
        }

        async function deleteWater(id) { await request(`/hydration/${id}`, { method: 'DELETE' }); loadWater(); }
        document.getElementById('waterDate').value = new Date().toISOString().split('T')[0];
        renderActiveSessionBanner(); syncActiveSessions(); function logout() { clearToken(); window.location.href = '/index.html'; }
        initWaterChart(); loadWaterData(); loadWater();
    </script>
</body>
</html>
