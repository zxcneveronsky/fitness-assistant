<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренировка — Fitness Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="font-['Inter'] bg-gray-50 min-h-screen">
<nav class="bg-white border-b border-gray-100 h-16 px-4 md:px-10 flex items-center justify-between">
    <a id="logoLink" href="/index.html" class="font-extrabold text-xl tracking-tighter">Fitness<span class="text-blue-600">Assistant</span></a>
    <div class="hidden md:flex gap-3 items-center text-sm">
        <a href="/dashboard.html" class="text-gray-600 hover:text-black">Главная</a>
        <a href="/meal.html" class="text-gray-600 hover:text-black">Еда</a>
        <a href="/hydration.html" class="text-gray-600 hover:text-black">Вода</a>
        <a href="/workout.html" class="font-semibold text-blue-600">Тренировки</a>
        <a href="/history.html" class="text-gray-600 hover:text-black">История</a>
        <a href="/profile.html" class="text-gray-600 hover:text-black">Профиль</a>
        <button onclick="logout()" class="text-red-500 hover:text-red-700 ml-4">Выйти</button>
                <button onclick="deleteAccount()" class="text-gray-400 hover:text-red-600 ml-2 text-sm" title="Удалить аккаунт">🗑️</button>
    </div>
    <button onclick="document.getElementById('mobileMenu').classList.toggle('hidden')" class="md:hidden text-gray-600 text-2xl px-2">☰</button>
</nav>
<div id="mobileMenu" class="hidden md:hidden bg-white border-b border-gray-100 px-4 py-3 space-y-2 text-sm">
    <a href="/dashboard.html" class="block text-gray-600 hover:text-black">Главная</a>
    <a href="/meal.html" class="block text-gray-600 hover:text-black">Еда</a>
    <a href="/hydration.html" class="block text-gray-600 hover:text-black">Вода</a>
    <a href="/workout.html" class="block text-blue-600 font-semibold">Тренировки</a>
    <a href="/history.html" class="block text-gray-600 hover:text-black">История</a>
    <a href="/profile.html" class="block text-gray-600 hover:text-black">Профиль</a>
    <hr class="border-gray-100">
    <button onclick="logout()" class="block text-red-500 hover:text-red-700 w-full text-left">Выйти</button>
    <button onclick="deleteAccount()" class="block text-gray-400 hover:text-red-600 w-full text-left text-xs">Удалить аккаунт</button>
</div>
<div id="activeSessionBanner" class="hidden bg-yellow-50 border-b border-yellow-200 px-4 md:px-10 py-2 text-sm flex items-center justify-between" style="position:sticky;top:64px;z-index:40">
    <span>⏳ <strong>Активная тренировка</strong> — <span id="bannerName"></span></span>
    <a id="bannerLink" href="" class="bg-yellow-200 text-yellow-800 px-4 py-1 rounded-lg font-semibold hover:bg-yellow-300">Продолжить</a>
</div>

<main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <a id="backLink" href="/workout.html" class="text-sm text-blue-600 hover:underline">&larr; К тренировкам</a>
            <h1 id="sessionTitle" class="text-3xl font-bold mt-1">🏋️ Тренировка</h1>
        </div>
        <button onclick="endSession()" class="bg-red-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-red-700">Завершить</button>
    </div>
    <p id="sessionError" class="text-red-500 text-sm mb-4 hidden"></p>
    <div id="exerciseList" class="space-y-4"></div>
</main>
<script src="/js/api.js"></script>
<script>
    if (!isAuth()) window.location.href = '/login.html';
    if (isAuth()) document.getElementById('logoLink').href = '/dashboard.html';

    const params = new URLSearchParams(window.location.search);
    const sessionIdParam = params.get('sessionId');
    const workoutIdParam = params.get('workoutId');
    let sessionId = null;
    let exercises = [];
    let workoutName = '';

    async function init() {
        if (sessionIdParam) {
            await resumeSession(parseInt(sessionIdParam));
        } else if (workoutIdParam) {
            await startNewSession(parseInt(workoutIdParam));
        } else {
            showError('Не указана тренировка или сессия');
        }
    }

    async function startNewSession(wid) {
        try {
            const w = await request(`/workout/${wid}`);
            if (!w) return;
            workoutName = w.name || w.exerciseName;
            exercises = w.exercises || [];
            document.getElementById('sessionTitle').textContent = `🚀 ${workoutName}`;

            const s = await request('/workout/session/start', {
                method: 'POST',
                body: JSON.stringify({ workoutId: wid, startTime: new Date().toISOString() })
            });
            if (!s) return;
            sessionId = s.id;
            saveActiveSession(sessionId, workoutName);
            renderExercises();
        } catch (e) { showError(e.message); }
    }

    async function resumeSession(sid) {
        try {
            const session = await request(`/workout/session/${sid}`);
            if (!session) return;
            sessionId = session.id;
            if (session.endTime) {
                removeActiveSession();
                showError('Эта сессия уже завершена');
                return;
            }

            const w = await request(`/workout/${session.workoutId}`);
            if (!w) return;
            workoutName = w.name || w.exerciseName;
            exercises = w.exercises || [];
            document.getElementById('sessionTitle').textContent = `🚀 ${workoutName}`;

            saveActiveSession(sessionId, workoutName);
            renderExercises();

            for (const ex of exercises) {
                loadSets(ex.id);
            }
        } catch (e) { showError(e.message); }
    }

    function renderExercises() {
        const container = document.getElementById('exerciseList');
        if (exercises.length === 0) {
            container.innerHTML = '<p class="text-gray-400 text-center py-8">Нет упражнений в этой тренировке</p>';
            return;
        }
        container.innerHTML = exercises.map((ex, idx) => `
            <div class="bg-white rounded-2xl p-5 border border-gray-100">
                <h3 class="font-bold text-lg">${idx + 1}. ${ex.name || ex.exerciseName}</h3>
                <div class="flex gap-2 mt-3">
                    <input id="weight_${ex.id}" type="number" step="0.5" placeholder="Вес" class="w-20 sm:w-28 px-2 sm:px-3 py-1.5 sm:py-2 border border-gray-200 rounded-lg sm:rounded-xl text-sm">
                    <input id="reps_${ex.id}" type="number" placeholder="Повторы" class="w-16 sm:w-24 px-2 sm:px-3 py-1.5 sm:py-2 border border-gray-200 rounded-lg sm:rounded-xl text-sm">
                    <button onclick="addSet(${ex.id})" class="bg-blue-600 text-white px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg sm:rounded-xl text-xs sm:text-sm hover:bg-blue-700">+ Подход</button>
                </div>
                <div id="sets_${ex.id}" class="mt-3 space-y-1"></div>
            </div>
        `).join('');
    }

    async function addSet(exerciseId) {
        const weight = parseFloat(document.getElementById(`weight_${exerciseId}`).value);
        const reps = parseInt(document.getElementById(`reps_${exerciseId}`).value);
        if (!weight || !reps) { showError('Введите вес и повторы'); return; }
        try {
            await request('/workout/session/set', {
                method: 'POST',
                body: JSON.stringify({ sessionId, exerciseId, weight, reps, createdAt: new Date().toISOString() })
            });
            document.getElementById(`weight_${exerciseId}`).value = '';
            document.getElementById(`reps_${exerciseId}`).value = '';
            loadSets(exerciseId);
        } catch (e) { showError(e.message); }
    }

    async function loadSets(exerciseId) {
        try {
            const data = await request(`/workout/session/set?sessionId=${sessionId}&exerciseId=${exerciseId}&size=50`);
            const el = document.getElementById(`sets_${exerciseId}`);
            if (!el) return;
            el.innerHTML = data.content.length === 0
                ? ''
                : data.content.map((s, i) =>
                    `<div class="text-sm bg-gray-50 rounded-lg px-3 py-2 flex items-center justify-between" id="set_${s.id}">
                        <div class="flex items-center gap-1 flex-1">
                            <span>${i + 1}.</span>
                            <span id="setDisplay_${s.id}">${s.weight} кг × ${s.reps} повторов</span>
                            <div id="setEdit_${s.id}" class="hidden items-center gap-1">
                                <input id="editW_${s.id}" type="number" step="0.5" value="${s.weight}" class="w-16 sm:w-20 px-1 sm:px-2 py-1 border border-gray-200 rounded-lg text-xs sm:text-sm">
                                <span class="text-gray-400 text-xs sm:text-sm">кг</span>
                                <input id="editR_${s.id}" type="number" value="${s.reps}" class="w-12 sm:w-16 px-1 sm:px-2 py-1 border border-gray-200 rounded-lg text-xs sm:text-sm">
                                <span class="text-gray-400 text-xs sm:text-sm">повт</span>
                                <button onclick="saveSet(${s.id}, ${exerciseId})" class="text-green-600 hover:text-green-800 text-xs px-1">💾</button>
                            </div>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="toggleEdit(${s.id})" class="text-blue-500 hover:text-blue-700 text-xs px-1">✏️</button>
                            <button onclick="deleteSet(${s.id}, ${exerciseId})" class="text-red-400 hover:text-red-600 text-xs px-1">🗑️</button>
                        </div>
                    </div>`
                ).join('');
        } catch (e) {}
    }

    function toggleEdit(setId) {
        const display = document.getElementById(`setDisplay_${setId}`);
        const edit = document.getElementById(`setEdit_${setId}`);
        if (!display || !edit) return;
        display.classList.toggle('hidden');
        edit.classList.toggle('hidden');
    }

    async function saveSet(setId, exerciseId) {
        const weight = parseFloat(document.getElementById(`editW_${setId}`).value);
        const reps = parseInt(document.getElementById(`editR_${setId}`).value);
        if (isNaN(weight) || isNaN(reps) || weight < 0 || reps < 1) { showError('Введите корректные вес и повторы'); return; }
        try {
            await request('/workout/session/set', {
                method: 'PATCH',
                body: JSON.stringify({ id: setId, sessionId, exerciseId, weight, reps })
            });
            loadSets(exerciseId);
        } catch (e) { showError(e.message); }
    }

    async function deleteSet(setId, exerciseId) {
        if (!confirm('Удалить подход?')) return;
        try {
            await request(`/workout/session/set/${setId}?sessionId=${sessionId}`, { method: 'DELETE' });
            loadSets(exerciseId);
        } catch (e) { showError(e.message); }
    }

    async function endSession() {
        try {
            await request('/workout/session/end', {
                method: 'PATCH',
                body: JSON.stringify({ id: sessionId, endTime: new Date().toISOString() })
            });
            removeActiveSession();
            window.location.href = '/history.html';
        } catch (e) { showError(e.message); }
    }

    function showError(msg) {
        const el = document.getElementById('sessionError');
        el.textContent = msg;
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 5000);
    }

    renderActiveSessionBanner(); syncActiveSessions(); function logout() { clearToken(); window.location.href = '/index.html'; }
    init();
</script>
</body>
</html>
