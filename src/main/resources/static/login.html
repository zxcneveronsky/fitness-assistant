<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Fitness Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #ffffff; color: #1d1d1f; overflow-x: hidden; }
        .hero-title { font-family: 'Manrope', sans-serif; letter-spacing: -0.04em; line-height: 0.9; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: saturate(180%) blur(20px); }
        .btn-apple { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); border-radius: 1.25rem; }
        .btn-apple:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .auth-card { transition: all 0.5s cubic-bezier(0.15, 0.83, 0.66, 1); border-radius: 2.2rem; border: 1px solid #f2f2f7; background: #ffffff; }
        .auth-input { transition: all 0.2s ease; }
        .auth-input:focus { border-color: #0071e3; box-shadow: 0 0 0 4px rgba(0,113,227,0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
<nav class="glass-nav h-16 flex items-center px-4 md:px-10 border-b border-gray-100/50 shrink-0">
    <a href="/index.html" class="font-extrabold text-xl tracking-tighter">Fitness<span class="text-blue-600">Assistant</span></a>
</nav>

<main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="animate__animated animate__fadeInUp auth-card p-6 md:p-10 w-full max-w-md shadow-lg">
        <h1 class="hero-title text-3xl sm:text-4xl font-extrabold tracking-tighter mb-2">Вход</h1>
        <p class="text-gray-400 font-medium mb-8">Войди, чтобы продолжить</p>

        <form id="loginForm" class="space-y-4 sm:space-y-5">
            <div>
                <label class="text-sm font-semibold text-gray-600">Email</label>
                <input type="email" id="email" required placeholder="user@example.com" class="auth-input w-full mt-1 sm:mt-1.5 px-4 py-2.5 sm:py-3 border border-gray-200 rounded-xl focus:outline-none text-sm">
            </div>
            <div>
                <label class="text-sm font-semibold text-gray-600">Пароль</label>
                <input type="password" id="password" required placeholder="••••••••" class="auth-input w-full mt-1 sm:mt-1.5 px-4 py-2.5 sm:py-3 border border-gray-200 rounded-xl focus:outline-none text-sm">
            </div>
            <p id="error" class="text-red-500 text-sm hidden"></p>
            <button type="submit" class="btn-apple w-full bg-blue-600 text-white font-bold py-3 sm:py-3.5 text-sm sm:text-base hover:bg-blue-700">Войти</button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-sm text-gray-500">
                Нет аккаунта? <a href="/register.html" class="text-blue-600 font-semibold hover:underline">Зарегистрируйся</a>
            </p>
            <p class="text-xs text-gray-300 mt-3 font-medium">
                Демо: user@example.com / password123
            </p>
        </div>
    </div>
</main>

<script src="/js/api.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('error');
        errorEl.classList.add('hidden');
        try {
            const data = await request('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
            });
            setToken(data.token);
            window.location.href = '/dashboard.html';
        } catch (err) {
            errorEl.textContent = err.message;
            errorEl.classList.remove('hidden');
        }
    });
</script>
</body>
</html>
