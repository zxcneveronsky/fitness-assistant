<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Fitness Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="font-['Inter'] bg-gray-50 min-h-screen">
<nav class="bg-white border-b border-gray-100 h-16 px-4 md:px-10 flex items-center justify-between">
    <a id="logoLink" href="/index.html" class="font-extrabold text-xl tracking-tighter">Fitness<span class="text-blue-600">Assistant</span></a>
    <div class="hidden md:flex gap-3 items-center text-sm">
        <a href="/dashboard.html" class="text-gray-600 hover:text-black">Главная</a>
        <a href="/meal.html" class="text-gray-600 hover:text-black">Еда</a>
        <a href="/hydration.html" class="text-gray-600 hover:text-black">Вода</a>
        <a href="/workout.html" class="text-gray-600 hover:text-black">Тренировки</a>
        <a href="/history.html" class="text-gray-600 hover:text-black">История</a>
        <a href="/profile.html" class="font-semibold text-blue-600">Профиль</a>
        <button onclick="logout()" class="text-red-500 hover:text-red-700 ml-4">Выйти</button>
                <button onclick="deleteAccount()" class="text-gray-400 hover:text-red-600 ml-2 text-sm" title="Удалить аккаунт">🗑️</button>
    </div>
    <button onclick="document.getElementById('mobileMenu').classList.toggle('hidden')" class="md:hidden text-gray-600 text-2xl px-2">☰</button>
</nav>
<div id="mobileMenu" class="hidden md:hidden bg-white border-b border-gray-100 px-4 py-3 space-y-2 text-sm">
    <a href="/dashboard.html" class="block text-gray-600 hover:text-black">Главная</a>
    <a href="/meal.html" class="block text-gray-600 hover:text-black">Еда</a>
    <a href="/hydration.html" class="block text-gray-600 hover:text-black">Вода</a>
    <a href="/workout.html" class="block text-gray-600 hover:text-black">Тренировки</a>
    <a href="/history.html" class="block text-gray-600 hover:text-black">История</a>
    <a href="/profile.html" class="block text-blue-600 font-semibold">Профиль</a>
    <hr class="border-gray-100">
    <button onclick="logout()" class="block text-red-500 hover:text-red-700 w-full text-left">Выйти</button>
    <button onclick="deleteAccount()" class="block text-gray-400 hover:text-red-600 w-full text-left text-xs">Удалить аккаунт</button>
</div>
    <div id="activeSessionBanner" class="hidden bg-yellow-50 border-b border-yellow-200 px-4 md:px-10 py-2 text-sm flex items-center justify-between" style="position:sticky;top:64px;z-index:40">
        <span>⏳ <strong>Активная тренировка</strong> — <span id="bannerName"></span></span>
        <a id="bannerLink" href="" class="bg-yellow-200 text-yellow-800 px-4 py-1 rounded-lg font-semibold hover:bg-yellow-300">Продолжить</a>
    </div>
<main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">👤 Профиль и цели</h1>
    <p id="profileError" class="text-red-500 text-sm mb-4 hidden"></p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-2xl p-6 border border-gray-100">
            <h2 class="font-bold text-lg mb-4">Параметры</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-sm text-gray-500 font-medium">Имя</label>
                    <input id="name" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-sm text-gray-500 font-medium">Вес (кг)</label>
                    <input id="weight" type="number" step="0.1" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-sm text-gray-500 font-medium">Рост (см)</label>
                    <input id="height" type="number" step="1" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-sm text-gray-500 font-medium">Пол</label>
                    <select id="gender" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 bg-white">
                        <option value="">Не указан</option>
                        <option value="MALE">Мужской</option>
                        <option value="FEMALE">Женский</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm text-gray-500 font-medium">Дата рождения</label>
                    <input id="birthDate" type="date" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="saveProfile()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 w-full">Сохранить параметры</button>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 border border-gray-100">
            <h2 class="font-bold text-lg mb-4">Цели (КБЖУ)</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-sm text-gray-500 font-medium">Калории (ккал/день)</label>
                    <input id="targetKcal" type="number" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-sm text-gray-500 font-medium">Белки (г/день)</label>
                    <input id="targetProteins" type="number" step="0.1" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-sm text-gray-500 font-medium">Жиры (г/день)</label>
                    <input id="targetFats" type="number" step="0.1" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-sm text-gray-500 font-medium">Углеводы (г/день)</label>
                    <input id="targetCarbs" type="number" step="0.1" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-sm text-gray-500 font-medium">Вода (л/день)</label>
                    <input id="targetHydration" type="number" step="0.1" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="saveTargets()" class="bg-green-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-green-700 w-full">Сохранить цели</button>
                <button onclick="enableAutopilot()" class="bg-gray-100 text-gray-600 px-8 py-3 rounded-xl font-bold hover:bg-gray-200 w-full text-sm">🤖 Авторасчёт целей</button>
            </div>
        </div>
    </div>
</main>
<script src="/js/api.js"></script>
<script>
    if (!isAuth()) window.location.href = '/login.html';
    if (isAuth()) document.getElementById('logoLink').href = '/dashboard.html';

    let profileExists = false;
    let initialTargets = {};

    async function loadProfile() {
        try {
            const p = await request('/profile');
            if (p) {
                profileExists = true;
                document.getElementById('name').value = p.name || '';
                document.getElementById('weight').value = p.weight || '';
                document.getElementById('height').value = p.height || '';
                document.getElementById('gender').value = p.gender || '';
                document.getElementById('birthDate').value = p.birthDate || '';
            }
        } catch (e) { profileExists = false; }
        try {
            const t = await request('/profile/targets');
            if (t) {
                document.getElementById('targetKcal').value = t.targetKcal || '';
                document.getElementById('targetProteins').value = t.targetProteins || '';
                document.getElementById('targetFats').value = t.targetFats || '';
                document.getElementById('targetCarbs').value = t.targetCarbs || '';
                document.getElementById('targetHydration').value = t.targetHydration || '';
                initialTargets = { kcal: t.targetKcal, prot: t.targetProteins, fat: t.targetFats, carb: t.targetCarbs, hydr: t.targetHydration };
            }
        } catch (e) {}
    }

    async function saveProfile() {
        const name = document.getElementById('name').value.trim();
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value);
        const gender = document.getElementById('gender').value;
        const birthDate = document.getElementById('birthDate').value;

        if (!name || !weight || !height || !gender || !birthDate) {
            showError('Заполните все поля (имя, вес, рост, пол, дата рождения)');
            return;
        }

        try {
            if (profileExists) {
                await request('/profile', { method: 'PATCH', body: JSON.stringify({ name, weight, height, gender, birthDate }) });
            } else {
                await request('/profile', { method: 'POST', body: JSON.stringify({ name, weight, height, gender, birthDate }) });
            }
            await loadProfile();
            showSuccess('Параметры сохранены');
        } catch (e) { showError(e.message); }
    }

    async function saveTargets() {
        const kcal = parseFloat(document.getElementById('targetKcal').value);
        const prot = parseFloat(document.getElementById('targetProteins').value);
        const fat = parseFloat(document.getElementById('targetFats').value);
        const carb = parseFloat(document.getElementById('targetCarbs').value);
        const hydr = parseFloat(document.getElementById('targetHydration').value);

        const t = {};
        if (kcal !== initialTargets.kcal) t.targetKcal = kcal;
        if (prot !== initialTargets.prot) t.targetProteins = prot;
        if (fat !== initialTargets.fat) t.targetFats = fat;
        if (carb !== initialTargets.carb) t.targetCarbs = carb;
        if (hydr !== initialTargets.hydr) t.targetHydration = hydr;

        if (Object.keys(t).length === 0) { showError('Нет изменений'); return; }

        try {
            await request('/profile/targets', { method: 'PATCH', body: JSON.stringify(t) });
            await loadProfile();
            showSuccess('Цели сохранены');
        } catch (e) { showError(e.message); }
    }

    async function enableAutopilot() {
        try {
            await request('/profile/targets/status?enabled=true', { method: 'PATCH' });
            await loadProfile();
            showSuccess('Авторасчёт включён');
        } catch (e) { showError(e.message); }
    }

    function showError(msg) {
        const el = document.getElementById('profileError');
        el.textContent = msg;
        el.classList.remove('hidden');
        el.classList.remove('text-green-600');
        el.classList.add('text-red-500');
        setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function showSuccess(msg) {
        const el = document.getElementById('profileError');
        el.textContent = msg;
        el.classList.remove('hidden');
        el.classList.remove('text-red-500');
        el.classList.add('text-green-600');
        setTimeout(() => el.classList.add('hidden'), 3000);
    }

    renderActiveSessionBanner(); syncActiveSessions(); function logout() { clearToken(); window.location.href = '/index.html'; }
    loadProfile();
</script>
</body>
</html>
