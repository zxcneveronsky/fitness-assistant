<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Fitness Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .dash-card { transition: all 0.5s cubic-bezier(0.15, 0.83, 0.66, 1); border-radius: 2.2rem; border: 1px solid #f2f2f7; background: #ffffff; }
        .dash-card:hover { transform: translateY(-4px); box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="font-['Inter'] bg-gray-50 min-h-screen">
<nav class="bg-white border-b border-gray-100 h-16 px-4 md:px-10 flex items-center justify-between">
    <a id="logoLink" href="/index.html" class="font-extrabold text-xl tracking-tighter">Fitness<span class="text-blue-600">Assistant</span></a>
    <div class="hidden md:flex gap-3 items-center text-sm">
        <a href="/dashboard.html" class="text-gray-600 hover:text-black">Главная</a>
        <a href="/meal.html" class="text-gray-600 hover:text-black">Еда</a>
        <a href="/hydration.html" class="text-gray-600 hover:text-black">Вода</a>
        <a href="/workout.html" class="text-gray-600 hover:text-black">Тренировки</a>
        <a href="/history.html" class="text-gray-600 hover:text-black">История</a>
        <a href="/profile.html" class="font-semibold text-blue-600">Профиль</a>
        <button onclick="logout()" class="text-red-500 hover:text-red-700 ml-4">Выйти</button>
        <button onclick="deleteAccount()" class="text-gray-400 hover:text-red-600 ml-2 text-sm" title="Удалить аккаунт">🗑️</button>
    </div>
    <button onclick="document.getElementById('mobileMenu').classList.toggle('hidden')" class="md:hidden text-gray-600 text-2xl px-2">☰</button>
</nav>
<div id="mobileMenu" class="hidden md:hidden bg-white border-b border-gray-100 px-4 py-3 space-y-2 text-sm">
    <a href="/dashboard.html" class="block text-gray-600 hover:text-black">Главная</a>
    <a href="/meal.html" class="block text-gray-600 hover:text-black">Еда</a>
    <a href="/hydration.html" class="block text-gray-600 hover:text-black">Вода</a>
    <a href="/workout.html" class="block text-gray-600 hover:text-black">Тренировки</a>
    <a href="/history.html" class="block text-gray-600 hover:text-black">История</a>
    <a href="/profile.html" class="block text-blue-600 font-semibold">Профиль</a>
    <hr class="border-gray-100">
    <button onclick="logout()" class="block text-red-500 hover:text-red-700 w-full text-left">Выйти</button>
    <button onclick="deleteAccount()" class="block text-gray-400 hover:text-red-600 w-full text-left text-xs">Удалить аккаунт</button>
</div>
    <div id="activeSessionBanner" class="hidden bg-yellow-50 border-b border-yellow-200 px-4 md:px-10 py-2 text-sm flex items-center justify-between" style="position:sticky;top:64px;z-index:40">
        <span>⏳ <strong>Активная тренировка</strong> — <span id="bannerName"></span></span>
        <a id="bannerLink" href="" class="bg-yellow-200 text-yellow-800 px-4 py-1 rounded-lg font-semibold hover:bg-yellow-300">Продолжить</a>
    </div>
<main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-bold">👤 Профиль</h1>
        <button onclick="enableAutopilot(this)" class="text-xs font-semibold bg-gray-100 text-gray-600 px-4 py-2 rounded-xl hover:bg-gray-200 transition-colors">🤖 Авторасчёт целей</button>
    </div>
    <p id="profileError" class="text-red-500 text-sm mb-4 hidden"></p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <div class="dash-card p-6 md:p-8">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl font-black">👤</div>
                <div>
                    <h2 class="font-bold text-xl">Параметры</h2>
                    <p class="text-xs text-gray-400">Основная информация</p>
                </div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Имя</label>
                    <input id="name" placeholder="Введите имя" class="w-full mt-1.5 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Вес (кг)</label>
                        <input id="weight" type="number" step="0.1" placeholder="0" class="w-full mt-1.5 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Рост (см)</label>
                        <input id="height" type="number" step="1" placeholder="0" class="w-full mt-1.5 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Пол</label>
                    <select id="gender" class="w-full mt-1.5 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 bg-white text-sm transition">
                        <option value="">Не указан</option>
                        <option value="MALE">Мужской</option>
                        <option value="FEMALE">Женский</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Дата рождения</label>
                    <input id="birthDate" type="date" class="w-full mt-1.5 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition">
                </div>
                <button id="saveProfileBtn" onclick="saveProfile(this)" class="bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 w-full text-sm transition-all hover:shadow-lg hover:shadow-blue-100">💾 Сохранить параметры</button>
            </div>
        </div>

        <div class="dash-card p-6 md:p-8">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-14 h-14 rounded-2xl bg-green-50 text-green-600 flex items-center justify-center text-2xl font-black">🎯</div>
                <div>
                    <h2 class="font-bold text-xl">Цели (КБЖУ)</h2>
                    <p class="text-xs text-gray-400">Дневные нормы</p>
                </div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Калории</label>
                    <div class="flex items-center gap-3 mt-1.5">
                        <input id="targetKcal" type="number" placeholder="0" class="flex-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition">
                        <span class="text-sm text-gray-400 font-medium">ккал/день</span>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs font-bold text-blue-500 uppercase tracking-widest">Белки</label>
                        <div class="flex items-center gap-2 mt-1.5">
                            <input id="targetProteins" type="number" step="0.1" placeholder="0" class="flex-1 px-3 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition w-0">
                            <span class="text-xs text-gray-400 font-medium">г</span>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-red-500 uppercase tracking-widest">Жиры</label>
                        <div class="flex items-center gap-2 mt-1.5">
                            <input id="targetFats" type="number" step="0.1" placeholder="0" class="flex-1 px-3 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition w-0">
                            <span class="text-xs text-gray-400 font-medium">г</span>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-green-500 uppercase tracking-widest">Углеводы</label>
                        <div class="flex items-center gap-2 mt-1.5">
                            <input id="targetCarbs" type="number" step="0.1" placeholder="0" class="flex-1 px-3 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition w-0">
                            <span class="text-xs text-gray-400 font-medium">г</span>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Вода</label>
                    <div class="flex items-center gap-3 mt-1.5">
                        <input id="targetHydration" type="number" step="0.1" placeholder="2.0" class="flex-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm transition">
                        <span class="text-sm text-gray-400 font-medium">л/день</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button id="saveTargetsBtn" onclick="saveTargets(this)" class="bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 text-sm transition-all hover:shadow-lg hover:shadow-green-100">💾 Сохранить</button>
                    <button id="autopilotBtn" onclick="enableAutopilot(this)" class="bg-gray-100 text-gray-600 py-3 rounded-xl font-bold hover:bg-gray-200 text-sm transition-all">🤖 Авторасчёт</button>
                </div>
            </div>
        </div>

    </div>
</main>
<script src="/js/api.js"></script>
<script>
    if (!isAuth()) window.location.href = '/login.html';
    if (isAuth()) document.getElementById('logoLink').href = '/dashboard.html';

    let profileExists = false;
    let initialTargets = {};

    async function loadProfile() {
        try {
            const p = await request('/profile');
            if (p) {
                profileExists = true;
                document.getElementById('name').value = p.name || '';
                document.getElementById('weight').value = p.weight || '';
                document.getElementById('height').value = p.height || '';
                document.getElementById('gender').value = p.gender || '';
                document.getElementById('birthDate').value = p.birthDate || '';
            }
        } catch (e) { profileExists = false; }
        try {
            const t = await request('/profile/targets');
            if (t) {
                document.getElementById('targetKcal').value = t.targetKcal || '';
                document.getElementById('targetProteins').value = t.targetProteins || '';
                document.getElementById('targetFats').value = t.targetFats || '';
                document.getElementById('targetCarbs').value = t.targetCarbs || '';
                document.getElementById('targetHydration').value = t.targetHydration || '';
                initialTargets = { kcal: t.targetKcal, prot: t.targetProteins, fat: t.targetFats, carb: t.targetCarbs, hydr: t.targetHydration };
            }
        } catch (e) { console.error('loadProfile error:', e); }
    }

    async function saveProfile(btn) {
        const name = document.getElementById('name').value.trim();
        const weight = safeFloat(document.getElementById('weight').value);
        const height = safeFloat(document.getElementById('height').value);
        const gender = document.getElementById('gender').value;
        const birthDate = document.getElementById('birthDate').value;

        if (!name || !weight || !height || !gender || !birthDate) {
            showError('Заполните все поля (имя, вес, рост, пол, дата рождения)');
            return;
        }

        btn.disabled = true;
        btn.textContent = '⏳ Сохраняю...';
        try {
            if (profileExists) {
                await request('/profile', { method: 'PATCH', body: JSON.stringify({ name, weight, height, gender, birthDate }) });
            } else {
                await request('/profile', { method: 'POST', body: JSON.stringify({ name, weight, height, gender, birthDate }) });
            }
            await loadProfile();
            btn.className = 'bg-green-100 text-green-700 py-3 rounded-xl font-bold w-full text-sm';
            btn.textContent = '✅ Сохранено';
        } catch (e) {
            btn.disabled = false;
            btn.textContent = '💾 Сохранить параметры';
            showError(e.message);
        }
    }

    async function saveTargets(btn) {
        const kcal = safeFloat(document.getElementById('targetKcal').value);
        const prot = safeFloat(document.getElementById('targetProteins').value);
        const fat = safeFloat(document.getElementById('targetFats').value);
        const carb = safeFloat(document.getElementById('targetCarbs').value);
        const hydr = safeFloat(document.getElementById('targetHydration').value);

        const t = {};
        if (kcal !== initialTargets.kcal) t.targetKcal = kcal;
        if (prot !== initialTargets.prot) t.targetProteins = prot;
        if (fat !== initialTargets.fat) t.targetFats = fat;
        if (carb !== initialTargets.carb) t.targetCarbs = carb;
        if (hydr !== initialTargets.hydr) t.targetHydration = hydr;

        if (Object.keys(t).length === 0) { showError('Нет изменений'); return; }

        btn.disabled = true;
        btn.textContent = '⏳ Сохраняю...';
        try {
            await request('/profile/targets', { method: 'PATCH', body: JSON.stringify(t) });
            await loadProfile();
            btn.className = 'bg-green-100 text-green-700 py-3 rounded-xl font-bold text-sm';
            btn.textContent = '✅ Сохранено';
        } catch (e) {
            btn.disabled = false;
            btn.textContent = '💾 Сохранить';
            showError(e.message);
        }
    }

    async function enableAutopilot(btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Включаю...';
        try {
            await request('/profile/targets/status?enabled=true', { method: 'PATCH' });
            await loadProfile();
            btn.className = 'bg-green-100 text-green-700 py-3 rounded-xl font-bold text-sm';
            btn.textContent = '✅ Авторасчёт включён';
        } catch (e) {
            btn.disabled = false;
            btn.textContent = '🤖 Авторасчёт';
            showError(e.message);
        }
    }

    function showError(msg) {
        const el = document.getElementById('profileError');
        el.textContent = msg;
        el.classList.remove('hidden');
        el.classList.remove('text-green-600');
        el.classList.add('text-red-500');
        setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function showSuccess(msg) {
        const el = document.getElementById('profileError');
        el.textContent = msg;
        el.classList.remove('hidden');
        el.classList.remove('text-red-500');
        el.classList.add('text-green-600');
        setTimeout(() => el.classList.add('hidden'), 3000);
    }

    renderActiveSessionBanner(); syncActiveSessions(); function logout() { clearToken(); window.location.href = '/index.html'; }
    loadProfile();
</script>
</body>
</html>
