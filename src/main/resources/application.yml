spring:
  application:
    name: fitness-assistant

  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_assistant
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO